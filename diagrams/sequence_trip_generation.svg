<svg viewBox='0 0 680 720' width='100%' role='img'>
<title>AI旅游助手 行程生成端到端时序图</title>
<desc>前端提交JWT请求，经JWT拦截器、TripStreamController、CityValidator校验后进入TravelAgent的ReAct循环，调用ItineraryGenerator聚合外部API生成行程，SSE推送前端，最后保存至MySQL。</desc>
<defs>
<marker id='arrow' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M2 1L8 5L2 9' fill='none' stroke='context-stroke' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></marker>
</defs>

<line x1='70' y1='64' x2='70' y2='700' stroke='#B4B2A9' stroke-dasharray='4 4' stroke-width='1'/>
<line x1='163' y1='64' x2='163' y2='700' stroke='#B4B2A9' stroke-dasharray='4 4' stroke-width='1'/>
<line x1='256' y1='64' x2='256' y2='700' stroke='#B4B2A9' stroke-dasharray='4 4' stroke-width='1'/>
<line x1='349' y1='64' x2='349' y2='700' stroke='#B4B2A9' stroke-dasharray='4 4' stroke-width='1'/>
<line x1='442' y1='64' x2='442' y2='700' stroke='#B4B2A9' stroke-dasharray='4 4' stroke-width='1'/>
<line x1='535' y1='64' x2='535' y2='700' stroke='#B4B2A9' stroke-dasharray='4 4' stroke-width='1'/>
<line x1='628' y1='64' x2='628' y2='700' stroke='#B4B2A9' stroke-dasharray='4 4' stroke-width='1'/>

<rect x='24' y='30' width='92' height='34' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='70' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#0C447C'>前端 Vue</text>
<rect x='117' y='30' width='92' height='34' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='163' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#0C447C'>JWT拦截</text>
<rect x='210' y='30' width='92' height='34' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='256' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#0C447C'>Controller</text>
<rect x='303' y='30' width='92' height='34' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='349' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#0C447C'>CityValidator</text>
<rect x='396' y='30' width='92' height='34' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='442' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#0C447C'>TravelAgent</text>
<rect x='489' y='30' width='92' height='34' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='535' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#0C447C'>ItineraryGen</text>
<rect x='582' y='30' width='92' height='34' rx='8' fill='#E6F1FB' stroke='#185FA5' stroke-width='0.5'/>
<text x='628' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='500' fill='#0C447C'>TripRecord</text>

<line x1='70' y1='100' x2='163' y2='100' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='116' y='93' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>POST /generate-stream (JWT)</text>

<line x1='163' y1='134' x2='256' y2='134' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='209' y='127' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>验签通过·注入UserContext</text>

<line x1='256' y1='168' x2='349' y2='168' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='302' y='161' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>validate(目的地)</text>

<line x1='349' y1='202' x2='256' y2='202' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='302' y='195' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>合法 / 400错别字建议</text>

<line x1='256' y1='236' x2='442' y2='236' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='349' y='229' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>run(req)·开启SSE</text>

<polyline points='442,272 470,272 470,298 442,298' fill='none' stroke='#534AB7' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='488' y='290' text-anchor='middle' font-family='sans-serif' font-size='11' font-weight='500' fill='#534AB7'>ReAct 循环</text>

<line x1='442' y1='340' x2='535' y2='340' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='488' y='333' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>generate(CollectedData)</text>

<polyline points='535,364 563,364 563,388 535,388' fill='none' stroke='#185FA5' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='571' y='380' text-anchor='start' font-family='sans-serif' font-size='11' fill='#185FA5'>并行调外部API</text>

<line x1='535' y1='430' x2='442' y2='430' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='488' y='423' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>返回 Itinerary(JSON)</text>

<line x1='442' y1='464' x2='256' y2='464' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='349' y='457' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>SSE done(token_usage)</text>

<line x1='256' y1='498' x2='70' y2='498' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='163' y='491' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>SSE 事件流推送</text>

<line x1='70' y1='560' x2='256' y2='560' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='163' y='553' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>用户点保存 saveTrip</text>

<line x1='256' y1='600' x2='628' y2='600' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='442' y='593' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>saveTrip(request)</text>

<polyline points='628,624 656,624 656,648 628,648' fill='none' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='616' y='640' text-anchor='end' font-family='sans-serif' font-size='11' fill='#5F5E5A'>写库 trip_record</text>

<line x1='628' y1='680' x2='70' y2='680' stroke='#5F5E5A' stroke-width='1.5' marker-end='url(#arrow)' fill='none'/>
<text x='349' y='673' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#5F5E5A'>保存成功</text>
</svg>
