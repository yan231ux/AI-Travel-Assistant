# Java 版基础设施：MySQL + Redis
# 用法：在 backend 目录下运行 docker compose up -d
# Java 应用（mvn spring-boot:run）本地跑，连接这两个服务

services:
  # MySQL 8
  mysql:
    image: mysql:8.0
    container_name: trip-planner-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trip_planner
      TZ: Asia/Shanghai
    ports:
      - "3310:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: trip-planner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
