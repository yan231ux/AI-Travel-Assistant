server:
  port: 8080

spring:
  application:
    name: trip-planner

  # 激活 local profile（application-local.yml 存 API Key，该文件已被 gitignore，不会提交）
  profiles:
    active: local

  # Database Configuration（本机开发配置，Docker MySQL 映射 3310，避开本机 3306）
  datasource:
    url: jdbc:mysql://127.0.0.1:3310/trip_planner?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      timeout: 5000ms
      
  # Jackson Configuration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # Multipart Upload（帖子封面上传：请求级上限略高于单文件校验 5MB）
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
      
  # SQL Initialization
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 本地上传图片存储（UploadService/WebConfig 同源；建议 .gitignore 排除）
app:
  upload-dir: ${UPLOAD_DIR:./uploads}

# 存量库结构自动升级：关键列 ALTER 失败默认阻止启动（审查报告 P0-4，避免"假在线"运行时才报
# Unknown column）；旧库确需手工修复时用 SCHEMA_AUTO_UPGRADE_STRICT=false 逃生（仅告警）。
schema:
  auto-upgrade-strict: ${SCHEMA_AUTO_UPGRADE_STRICT:true}

# MyBatis Plus Configuration
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# LLM Configuration (DashScope/Qwen)
llm:
  base-url: ${LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${LLM_API_KEY:}
  # 模型名：环境变量 LLM_MODEL 通过 Spring 宽松绑定映射到本属性（llm.model），
  # 且环境变量优先级高于本文件——所以 .env 里写 LLM_MODEL=xxx 一直是生效的
  # （曾误判为"yml 写死所以 env 无效"，用 content_moderation_task.model_name 反查才纠正过来）。
  # 这里显式写 ${LLM_MODEL:...} 只是为了让"哪来的、默认是什么"一眼可见，不改变既有语义。
  #
  # 默认值选 qwen3-max 而非 3.8-max，是因为 3.8 全系（max/flash）都是**推理模型**
  # （响应带 reasoning_content）：短输出场景（内容审核 6~16s）没问题，但整份行程 JSON
  # 一次生成输出量太大，实测 >180s 顶到 ItineraryGenerator 的 GENERATION_TIMEOUT_SECONDS
  # 而失败。qwen-turbo / qwen3-max 是非推理模型，行程生成实测 ~90s 可完成。
  model: ${LLM_MODEL:qwen3-max}
  embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-v3}
  # LLM 读超时（秒）：需 ≥ ItineraryGenerator.GENERATION_TIMEOUT_SECONDS（180s），
  # 否则 HTTP 读超时会更早把生成调用掐断并触发无意义重试
  timeout-seconds: 180
  max-iterations: 3
  # Agent 决策模式：
  #   legacy（默认）= 首轮 LLM 决策 + 后续轮按数据缺口用规则补轮（改造前行为，可复现、成本可控）
  #   autonomous    = 每轮都由 LLM 看已获数据决定下一步，并把失败调用（超时/空结果）回灌给模型自纠
  # 默认 legacy 以保证既有行为与测试基线不变；切 autonomous 需配套跑 probe_generation_smoke.py
  agent-mode: ${LLM_AGENT_MODE:legacy}
  # 原生工具调用（function calling）策略，仅在 agent-mode=autonomous 时生效：
  #   auto（默认）= 先试原生 tools，模型明确不接受则自动降级为文本 JSON 计划并按模型名记住；
  #   native      = 强制原生；text = 从不使用 tools（任何 chat 模型都能跑）。
  # 做成三态是为了能频繁更换模型（含免费额度模型）而不被 tools 支持度卡住。
  tool-calling: ${LLM_TOOL_CALLING:auto}
  # autonomous 模式下"允许由 LLM 决策的补轮次数"上限（默认 1）：
  #   首次补轮最需要模型判断（它才知道上一轮为什么失败、该换什么关键词）；
  #   再往后继续问，边际收益下降而 token 照付（实测 3 轮时是 legacy 的 3.3 倍）。
  #   0 = 补轮全走规则（最省）；调大 = 更自主但更贵。补轮总次数仍受 max-iterations 约束。
  llm-gapfill-rounds: ${LLM_GAPFILL_ROUNDS:1}

# Amap Configuration
amap:
  api-key: ${AMAP_API_KEY:}
  base-url: https://restapi.amap.com/v3

# Redis Cache Configuration
redis:
  enabled: ${REDIS_ENABLED:true}
  map-ttl-seconds: 86400
  weather-ttl-seconds: 1800
  rag-ttl-seconds: 21600

# Chroma 向量库（可选加速层）：默认开启；server 未启动/不可达时自动降级为内存余弦检索，行为完全一致。
# 启动方式见 README「RAG 与向量库（Chroma）」（须 chromadb==0.6.3，勿用 1.x）。想彻底关闭设 CHROMA_ENABLED=false。
chroma:
  enabled: ${CHROMA_ENABLED:true}
  base-url: ${CHROMA_BASE_URL:http://localhost:8000}
  collection-prefix: ${CHROMA_COLLECTION_PREFIX:guide}
  distance-func: ${CHROMA_DISTANCE:cosine}
  timeout-ms: 5000

# JWT 鉴权（用户系统）：secret 为 HS256 签名密钥，生产必须通过 JWT_SECRET 覆盖（≥32 字节）；
# token 默认 7 天过期。除 /auth/** 外所有接口需带 Authorization: Bearer <token>。
jwt:
  secret: ${JWT_SECRET:ai-travel-assistant-demo-jwt-secret-key-change-in-production}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}

# Known Cities
known-cities: 北京,大理,成都,三亚,厦门,西安

# AI 内容审核（设计方案 §4）
moderation:
  # 低风险内容是否允许"AI 放行即自动发布"（true=自动上线；false=退回全人工，AI 仅给建议）
  # 自动放行的准入条件三者缺一不可：规则无 HIGH/MEDIUM 命中 + 模型 decision=PASS + 分数 <0.65，
  # 且未命中"强制人工"类别（敏感信息 / 争议性话题）。
  auto-publish-enabled: ${MODERATION_AUTO_PUBLISH_ENABLED:true}

# CORS 允许来源（前端开发服务器，逗号分隔）
cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://192.168.137.1:5173

# 社区管理（阶段二）：首个管理员账号由启动初始化（生产必须用环境变量覆盖弱口令）
community:
  admin-username: ${COMMUNITY_ADMIN_USERNAME:admin}
  admin-password: ${COMMUNITY_ADMIN_PASSWORD:admin123}

# Logging Configuration
logging:
  level:
    com.yuntu.tripplanner: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"